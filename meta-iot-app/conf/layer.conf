# Add this layer's recipes and configuration files to BitBake's search path.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "iot_app"
BBFILE_PATTERN_iot_app = "^${LAYERDIR}/"
BBFILE_PRIORITY_iot_app = "8"

LAYERSERIES_COMPAT_iot_app = "scarthgap"

# The application, LVGL, and MicroPython sources are sibling directories of
# this layer. Keeping one project root avoids copying source files into a Yocto
# recipe whenever the application changes.
IOT_APP_PROJECT_ROOT := "${@os.path.realpath(os.path.join(d.getVar('LAYERDIR'), '..'))}"
