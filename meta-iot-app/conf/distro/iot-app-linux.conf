require conf/distro/poky.conf

DISTRO = "iot-app-linux"
DISTRO_NAME = "IoT App Linux"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "scarthgap"
DISTROOVERRIDES = "poky:iot-app-linux"

# IoT App has its own unit tests and does not run package ptest suites on the
# Raspberry Pi. Its LVGL backend draws directly to the framebuffer, so it does
# not need a desktop graphics stack. It also does not use audio, Bluetooth,
# mobile broadband, NFC, or NFS. Removing those features keeps their
# applications and supporting libraries out of the build. Zeroconf remains
# enabled because Avahi advertises the Raspberry Pi as rspi-iot-app.local.
DISTRO_FEATURES:remove = " \
    3g \
    alsa \
    bluetooth \
    debuginfod \
    nfc \
    nfs \
    opengl \
    pci \
    ptest \
    usbgadget \
    vulkan \
    wayland \
    x11 \
"

# Skip SPDX generation during local development builds to reduce build time
# and storage use. Enable it again when an image needs an SPDX SBOM.
INHERIT:remove = "create-spdx"

# IoT App uses one service model in the Yocto image. This keeps startup,
# network management, logs, and application restarts under systemd.
POKY_INIT_MANAGER:iot-app-linux = "systemd"

PACKAGE_CLASSES ?= "package_ipk"
