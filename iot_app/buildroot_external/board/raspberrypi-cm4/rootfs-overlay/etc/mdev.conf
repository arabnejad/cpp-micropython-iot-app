# Standard devices needed by the base BusyBox system.
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
hwrandom	root:root 444
grsec		root:root 660
kmem		root:root 640
mem		root:root 640
port		root:root 640
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660
tty		root:tty 666
tty[0-9]*	root:tty 660
vcsa*[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660

# ALSA sound devices retained from Buildroot's standard mdev configuration.
snd/pcm.*	root:audio 660
snd/control.*	root:audio 660
snd/midi.*	root:audio 660
snd/seq		root:audio 660
snd/timer	root:audio 660

# IoT App hardware access. The service account belongs to these groups.
fb[0-9]+		root:video 660
dri/card[0-9]+		root:video 660
dri/renderD[0-9]+	root:render 660
i2c-[0-9]+		root:i2c 660
input/event[0-9]+	root:input 660
input/mice		root:input 640
input/mouse[0-9]	root:input 640
input/ts[0-9]		root:input 600

# Load a matching kernel module when a device publishes a modalias.
$MODALIAS=.*	root:root 660 @modprobe "$MODALIAS"
